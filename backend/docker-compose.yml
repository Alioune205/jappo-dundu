# ============================================================
# Jappo Dundu — Environnement de DÉVELOPPEMENT
# PostgreSQL/PostGIS + Redis + backend Django (rechargement à chaud)
#
# Usage (depuis backend/) :
#   docker compose up -d db redis     # services seuls, Django sur le poste
#   docker compose up -d --build      # tout dans Docker
#   docker compose logs -f web
#   docker compose exec web python manage.py test
#   docker compose down               # arrêt (données conservées)
#   WEB_PORT=8001 docker compose up -d   # si le port 8000 est déjà pris
#
# Les ports ne sont exposés que sur 127.0.0.1 (jamais sur le réseau).
# Production : voir deploy/docker-compose.prod.yml
#
# Auteur : El Hadji Massogui Diop
# ============================================================

services:
  db:
    image: postgis/postgis:16-3.5-alpine
    container_name: jappo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jappo_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: jappo_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: jappo_web
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: "True"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-jappo_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/1
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      # Code monté : runserver recharge à chaque modification
      - .:/app
      # Modèles ML persistés hors du code
      - ml_models:/app/ml/trained_models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput
      && exec python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
  ml_models:
